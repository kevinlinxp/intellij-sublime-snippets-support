import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'antlr'
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version "$kotlin_version"
    id 'org.jetbrains.intellij.platform' version "$intellij_platform_gradle_plugin_version"
}

def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    def localProperties = new Properties()
    localPropertiesFile.withInputStream { localProperties.load(it) }
    localProperties.each { key, value ->
        if (!project.hasProperty(key.toString())) {
            ext[key.toString()] = value
        }
    }
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
        intellijDependencies()
    }
}

dependencies {
    antlr "org.antlr:antlr4:$antlr_version"
    implementation "org.antlr:antlr4-runtime:$antlr_version"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.opentest4j:opentest4j:1.3.0'

    intellijPlatform {
        intellijIdeaCommunity("$intellij_release_version")
        instrumentationTools()
        testFramework(TestFrameworkType.Platform.INSTANCE)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    jvmToolchain(21)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = '21'
}

intellijPlatform {
    pluginConfiguration {
        name = "$plugin_name"
        ideaVersion {
            sinceBuild = '242'
            untilBuild = provider { null }
        }
    }

    if (project.hasProperty('intellijPublishToken')) {
        publishing {
            token = project.property('intellijPublishToken')
        }
    }
}

generateGrammarSource {
    arguments += [
            '-no-listener',
            '-package', 'com.kevinlinxp.sublimeSnippetsSupport'
    ]
}

compileKotlin.dependsOn generateGrammarSource
compileTestKotlin.dependsOn generateTestGrammarSource
